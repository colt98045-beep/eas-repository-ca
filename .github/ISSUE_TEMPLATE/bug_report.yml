name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `python eas_monitor.py`
        2. Open the dashboard
        3. ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "e.g. Python 3.12, macOS, Firefox 133"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or browser console errors
      render: text
